:root{--bg:#090d0a;--sf:#0f1511;--sf2:#151d17;--bd:#1e2a21;--tx:#e9eee9;--mu:#7f8f84;--ac:#b4f06a;--rd:#ef6b6b}

<svg width="0" height="0" style="position:absolute"><symbol id="lg" viewBox="0 0 36 36"><rect x="1.5" y="1.5" width="33" height="33" rx="10" fill="#13200f" stroke="#b4f06a" stroke-width="2"/><path d="M10 14v-3a1 1 0 0 1 1-1h3M22 10h3a1 1 0 0 1 1 1v3M26 22v3a1 1 0 0 1-1 1h-3M14 26h-3a1 1 0 0 1-1-1v-3" fill="none" stroke="#b4f06a" stroke-width="2" stroke-linecap="round"/><path d="M14 18h8" stroke="#b4f06a" stroke-width="2" stroke-linecap="round"/></symbol></svg>
<div class="shell"><aside id="side"><div class="brand"><svg><use href="#lg"/></svg><span>decode<b>.</b></span></div>
<div class="lbl">WORKSPACE</div><div id="ws"></div><div class="lbl">MENU</div><nav id="nav"></nav>
<div class="me"><div class="av" id="av">D</div><div><b id="who"></b><span class="mu" id="role"></span></div><button class="ghost" data-a="logout" title="Back to login" style="margin-left:auto">Log out</button></div></aside>
<div class="scrim" id="scrim"></div>

<main id="app"><div class="msg">Loading…</div></main></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={cal:{y:new Date().getFullYear(),m:new Date().getMonth()},imp:{rows:[],msg:'',err:'',busy:false},f:{},cmp:{a:{},b:{}},ins:{busy:false,items:null,err:'',map:{}},ai:{busy:false,txt:'',err:''},zone:{url:'',file:null,res:null,busy:false,err:'',note:''},sm:null,gate:true,ready:false,ws:'team',tab:'dashboard',db:null,uid:null,me:null,admin:false,assets:null,dl:null,team:[],pers:[],accts:[],log:[],form:null,an:'quality',acct:'all',err:''};
const OPT={zone:['Not recorded','Major Zone','Minor Zone'],dir:['Buy','Sell'],strat:['V1 — Primary strategy','V2 — Optional confirmation'],session:['Asian','London','New York','London/NY overlap'],market:['Trending','Ranging','Volatile','News-driven'],result:['Open','Win','Loss','Breakeven'],trend:['Uptrend','Downtrend','Unclear'],tap1:['Not recorded','FVG','Wick FVG','Imbalance candle','None'],yn:['Not recorded','Yes','No'],q:['Not rated','A+','A','B','C']};
const n=v=>{const x=parseFloat(v);return isFinite(x)?x:null},f2=v=>v==null?'–':(Math.round(v*100)/100).toString();
const trades=()=>S.ws==='team'?S.team:S.pers.filter(t=>S.acct==='all'||t.acct===S.acct);
function stats(ts){const c=ts.filter(t=>t.result&&t.result!=='Open').sort((a,b)=>(a.date||'')<(b.date||'')?-1:1);
 const w=c.filter(t=>t.result==='Win'),l=c.filter(t=>t.result==='Loss'),pl=t=>n(t.pnl)??((n(t.r)??0)*(n(t.riskAmt)??1));
 const gw=w.reduce((a,t)=>a+Math.max(0,pl(t)),0),gl=Math.abs(l.reduce((a,t)=>a+Math.min(0,pl(t)),0));
 const rs=c.map(t=>n(t.r)).filter(x=>x!=null);let eq=0,pk=0,dd=0;c.forEach(t=>{eq+=pl(t);pk=Math.max(pk,eq);dd=Math.max(dd,pk-eq)});
 const ap=c.filter(t=>t.quality==='A+');
 return{total:ts.length,closed:c.length,w:w.length,l:l.length,be:c.length-w.length-l.length,lossR:c.length?l.length/c.length*100:null,sd:rs.length>1?Math.sqrt(rs.reduce((a,x)=>a+(x-rs.reduce((p,q)=>p+q,0)/rs.length)**2,0)/(rs.length-1)):null,streak:(()=>{let m=0,k=0;c.forEach(t=>{if(t.result==='Loss'){k++;m=Math.max(m,k)}else k=0});return m})(),win:c.length?w.length/c.length*100:null,pf:gl?gw/gl:(gw?Infinity:null),avgR:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null,net:c.reduce((a,t)=>a+pl(t),0),dd,apWin:ap.length?ap.filter(t=>t.result==='Win').length/ap.length*100:null,apN:ap.length}}
const pct=v=>v==null?'–':f2(v)+'%',pf=v=>v==null?'–':v===Infinity?'no losses':f2(v);
const kpi=(l,v,c='')=>`<div class="card"><span class="mu">${l}</span><b class="${c}">${v}</b></div>`;
const sgn=v=>v>0?'pos':v<0?'neg':'';
function dash(){const s=stats(trades());let h=`<div class="grid">${kpi('Total trades',s.total)}${kpi('Win rate',pct(s.win))}${kpi('Profit factor',pf(s.pf))}${kpi('Average R',f2(s.avgR),sgn(s.avgR))}${kpi('Net P&amp;L',f2(s.net),sgn(s.net))}${kpi('Max drawdown',f2(s.dd),s.dd?'neg':'')}${kpi('Expectancy (R)',f2(s.avgR))}${kpi('A+ success',pct(s.apWin)+(s.apN?` <span class="mu">(${s.apN})</span>`:''))}</div>`;
 h+=calSec();h+='<h2>Strategy version performance</h2>'+grp('strat');
 if(!s.total)h+='<div class="msg">No trades yet. Add your first trade in Trade Journal.</div>';
 if(S.ws==='personal')h+=acctPanel();return h}
function grp(k){const m={};trades().forEach(t=>{const v=(k==='choch'?t.choch15:k==='news'?t.news:k==='second'?t.second:k==='tap1'?t.tap1:t[k])||'Not recorded';(m[v]=m[v]||[]).push(t)});
 if(k==='outcome'){}
 const rows=Object.entries(m).sort().map(([v,ts])=>{const s=stats(ts);return`<tr><td>${E(v)}</td><td>${s.closed}/${s.total}</td><td>${pct(s.win)}</td><td class="${sgn(s.avgR)}">${f2(s.avgR)}</td><td>${pf(s.pf)}</td><td class="${sgn(s.avgR)}">${f2(s.avgR)}</td><td class="${sgn(s.net)}">${f2(s.net)}</td><td>${f2(s.dd)}</td></tr>`}).join('');
 return`<div class="wrap card"><table><tr><th>Condition</th><th>Closed/Total</th><th>Win rate</th><th>Avg R</th><th>Profit factor</th><th>Expectancy</th><th>Net P&amp;L</th><th>Max DD</th></tr>${rows||'<tr><td colspan=8 class="mu">No data</td></tr>'}</table></div>`}
function analytics0(){const D=[['quality','Setup quality (A+/A/B/C)'],['strat','Strategy version'],['pair','Currency pair'],['session','Trading session'],['market','Market condition'],['tap1','First tap confirmation'],['second','Entry on second tap'],['choch','15M CHoCH used'],['news','News vs non-news'],['result','Winning vs losing']];
 return`<div class="row"><label>Compare by<select id="an">${D.map(d=>`<option value="${d[0]}" ${S.an===d[0]?'selected':''}>${d[1]}</option>`).join('')}</select></label>${S.ws==='team'?'<span class="mu">Each shared trade is counted once.</span>':''}</div><h2>Overall</h2>${grp('_all')}<h2>By condition</h2>${grp(S.an)}`}
const sel=(id,o,v)=>`<select id="${id}">${o.map(x=>`<option ${x===v?'selected':''}>${E(x)}</option>`).join('')}</select>`;
function journal(){return`<div class="row" style="justify-content:space-between"><button class="pri" data-a="new">+ New trade</button><div class="row"><button data-a="imp">Import CSV/JSON</button><input type="file" id="impf" accept=".csv,.json,.txt" hidden><button data-a="csv">Export CSV</button><button data-a="json">Export JSON</button></div></div>`+impView()+(S.form?form():'')+list()}
function list(){const ts=[...trades()].sort((a,b)=>(b.date||'')<(a.date||'')?-1:1);
 return`<h2>Trades</h2><div class="wrap card"><table><tr><th>ID</th><th>Date</th><th>Pair</th><th>Dir</th><th>Quality</th><th>Result</th><th>R</th><th>P&amp;L</th><th>By</th><th></th></tr>${ts.map(t=>`<tr><td>${E(t.id)}</td><td>${E((t.date||'').replace('T',' '))}</td><td>${E(t.pair)}</td><td>${E(t.dir)}</td><td>${E(t.quality)}</td><td>${E(t.result)}</td><td class="${sgn(n(t.r))}">${f2(n(t.r))}</td><td class="${sgn(n(t.pnl))}">${f2(n(t.pnl))}</td><td class="mu">${E(t.byName||'')}</td><td><button class="ghost" data-a="edit" data-id="${E(t.id)}">Edit</button></td></tr>`).join('')||'<tr><td colspan=10 class="mu">No trades yet</td></tr>'}</table></div>`}
function form(){const t=S.form,i=(id,l,type='text',x='')=>`<label>${l}<input id="${id}" type="${type}" step="any" value="${E(t[id])}" ${x}></label>`,s=(id,l,o)=>`<label>${l}${sel(id,o,t[id])}</label>`,ta=(id,l)=>`<label>${l}<textarea id="${id}" rows="2">${E(t[id])}</textarea></label>`;
 const ac=S.ws==='personal'?`<label>Funded account<select id="acct"><option value="">—</option>${S.accts.map(a=>`<option value="${a.id}" ${t.acct===a.id?'selected':''}>${E(a.prop)} · ${E(a.name)}</option>`).join('')}</select></label>`:'';
 return`<div class="card" style="margin-top:12px"><b style="font-size:16px">${t._new?'New trade':'Edit '+E(t.id)}</b>
<div class="seg"><span class="mu">Zone type</span><input type="hidden" id="zone" value="${E(t.zone)}">${['Major Zone','Minor Zone'].map(z=>`<button type="button" class="${t.zone===z?'on':''}" data-zone="${z}">${z}</button>`).join('')}</div>
<fieldset><legend>Trade</legend><div class="f">${i('id','Trade ID','text',t._new?'':'disabled')}${i('date','Date &amp; time','datetime-local')}${i('pair','Currency pair')}${s('dir','Buy / Sell',OPT.dir)}${s('strat','Strategy version',OPT.strat)}${s('session','Session',OPT.session)}${s('market','Market condition',OPT.market)}${s('result','Result',OPT.result)}${ac}</div></fieldset>
<fieldset><legend>Entry &amp; risk</legend><div class="f">${i('entry','Entry price','number')}${i('sl','Stop loss','number')}${i('tp','Take profit','number')}${i('lots','Lot size','number')}${i('riskPct','Risk %','number')}${i('riskAmt','Risk amount','number')}${i('r','Outcome (R)','number')}${i('pnl','Profit / loss','number')}</div><div class="mu" id="rr" style="margin-top:8px"></div></fieldset>
<fieldset><legend>Strategy conditions</legend><div class="f">${s('trend','1H trend',OPT.trend)}${s('tap1','First tap confirmation',OPT.tap1)}${s('second','Entry on second tap',OPT.yn)}${s('ob50','Shortened 50% OB zone',OPT.yn)}${s('choch15','15M CHoCH used',OPT.yn)}${s('chochPresent','15M CHoCH present',OPT.yn)}${s('news','News time',OPT.yn)}${i('newsTime','News time (if any)','time')}${s('quality','Setup quality',OPT.q)}</div></fieldset>
<fieldset><legend>Review</legend><div class="f">${ta('entryReason','Entry reason')}${ta('exitReason','Exit reason')}${ta('mistakes','Mistakes')}${ta('violations','Rule violations')}${ta('notes','Notes')}</div>
<div class="row" style="margin-top:10px">${['Before','After'].map(k=>`<div><label>${k==='Before'?'Before-entry':'After-exit'} screenshot<input type="file" accept="image/*" data-shot="shot${k}"></label>${t['shot'+k]?`<img class="s" src="${E(t['shot'+k])}">`:''}</div>`).join('')}</div>${S.assets?'':'<div class="mu">Screenshot upload needs editor access.</div>'}</fieldset>
<div class="row"><button class="pri" data-a="save">Save trade</button><button data-a="cancel">Cancel</button><span class="neg">${E(S.err)}</span></div>
${t.hist&&t.hist.length?`<div class="mu" style="margin-top:10px">Edit history: ${t.hist.slice(-5).map(h=>E(h.by)+' · '+new Date(h.at).toLocaleString()+' · '+E(h.what)).join(' | ')}</div>`:''}</div>`}
